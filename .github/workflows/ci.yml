name: T3 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'

# The group is event-aware on purpose: with a ref-only group, the nightly `schedule` run and a
# push to `main` share a group (both are refs/heads/main) and cancel each other, which is what
# killed several nightly runs mid-flight (one at 2 h 25 m). cancel-in-progress is kept for what it
# is actually for -- a superseded push or PR update on the same ref -- and disabled for the
# scheduled run, which has nothing to supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  build-and-test:
    name: Build and Test T3
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      # 1. Checkout T3 (The repo running this CI)
      - name: Checkout T3
        uses: actions/checkout@v7
        with:
          path: T3

      # 2. Checkout ARC (Dependency)
      - name: Checkout ARC
        uses: actions/checkout@v7
        with:
          repository: ReactionMechanismGenerator/ARC
          ref: main
          path: ARC

      # 3. Checkout RMG Database
      - name: Checkout RMG Database
        uses: actions/checkout@v7
        with:
          repository: ReactionMechanismGenerator/RMG-database
          path: RMG-database
          ref: main
          fetch-depth: 1

      # 4. Checkout RMG-Py (needed at runtime for the rmg_env subprocess)
      - name: Checkout RMG-Py
        uses: actions/checkout@v7
        with:
          repository: ReactionMechanismGenerator/RMG-Py
          path: RMG-Py
          ref: main
          fetch-depth: 1

      # 5. Clean Disk (Important for heavy conda envs)
      - name: Clean Ubuntu Image
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 6. Setup T3 Environment
      - name: Set up micromamba (t3_env)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: t3_env
          environment-file: T3/environment.yml
          cache-environment: true
          generate-run-shell: true

      # 7. Setup RMG Environment (rmg_env) — required by all T3 tests that
      - name: Set up micromamba (rmg_env)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: rmg_env
          environment-file: RMG-Py/environment.yml
          cache-environment: true
          generate-run-shell: false
          create-args: >-
            python=3.11
            --channel-priority strict

      # 8a. Cache key for the compiled RMG-Py Cython extensions.
      # The build is only valid for the exact RMG-Py source it was built from AND the exact
      # rmg_env it was built against (the extensions link against that env's Python, numpy and
      # Cython ABIs), so the key is the RMG-Py commit SHA plus a hash of the resolved package
      # list of rmg_env (name + version + build string of every package), not just
      # environment.yml -- environment.yml is not a lock file and can re-solve to a different
      # numpy while hashing the same.
      - name: Compute RMG-Py build cache key
        id: rmg-build-key
        shell: bash -el {0}
        run: |
          rmg_sha="$(git -C RMG-Py rev-parse HEAD)"
          env_hash="$(micromamba list -n rmg_env | sort | sha256sum | cut -c1-16)"
          echo "key=rmgpy-build-${{ runner.os }}-${{ runner.arch }}-${rmg_sha}-${env_hash}" >> "$GITHUB_OUTPUT"

      # 8b. Restore the compiled extensions if this exact (source, environment) pair was built
      # before. There are deliberately no restore-keys: a partial match would serve a build made
      # from different sources or against a different ABI, which is the stale-cache failure mode
      # nobody can reproduce locally. A miss just means the build runs, as it does today.
      - name: Cache RMG-Py Cython build
        id: rmg-build-cache
        uses: actions/cache@v6
        with:
          path: |
            RMG-Py/**/*.so
            RMG-Py/build
          key: ${{ steps.rmg-build-key.outputs.key }}

      # 8. Compile RMG-Py (Cython extensions, in rmg_env)
      - name: Compile RMG-Py
        shell: bash -el {0}
        working-directory: RMG-Py
        run: |
          if [ "${{ steps.rmg-build-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Reusing the cached RMG-Py Cython build (${{ steps.rmg-build-key.outputs.key }})."
          else
            micromamba run -n rmg_env make
          fi
          echo "PYTHONPATH=${{ github.workspace }}/RMG-Py" >> $GITHUB_ENV

      # 9. Install & Compile ARC (Dependency, into t3_env)
      - name: Install and Compile ARC
        shell: micromamba-shell {0}
        working-directory: ARC
        run: |
          echo "::group::Compile ARC extensions"
          make compile
          echo "::endgroup::"

          echo "::group::Install ARC in editable mode"
          pip install -e .
          echo "::endgroup::"

      # 9b. Install xTB into its own xtb_env (used by ARC for gfn2 jobs)
      - name: Install xTB
        shell: bash -el {0}
        working-directory: ARC
        run: bash devtools/install_xtb.sh

      # 10. Install T3 (Self)
      - name: Install T3
        shell: micromamba-shell {0}
        working-directory: T3
        run: |
          pip install -e .

      # 11. Run T3 Tests
      - name: Run Tests
        shell: micromamba-shell {0}
        working-directory: T3
        run: |
          echo "Running T3 Tests..."
          export PYTHONPATH="$PYTHONPATH:$(pwd):${{ github.workspace }}/ARC:${{ github.workspace }}/RMG-Py"
          export RMG_DB_PATH="${{ github.workspace }}/RMG-database"

          # Run pytest on the T3 tests directory
          pytest tests/ --cov=t3 --cov-report=xml -ra -vv

      # 9. Upload Coverage
      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: T3/coverage.xml
          flags: unittests
          name: codecov-t3
          fail_ci_if_error: false
