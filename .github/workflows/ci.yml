name: T3 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'

# The group is event-aware on purpose: with a ref-only group, the nightly `schedule` run and a
# push to `main` share a group (both are refs/heads/main) and cancel each other, which is what
# killed several nightly runs mid-flight (one at 2 h 25 m). cancel-in-progress is kept for what it
# is actually for -- a superseded push or PR update on the same ref -- and disabled for the
# scheduled run, which has nothing to supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  build-and-test:
    name: Build and Test T3
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      # 1. Checkout T3 (The repo running this CI)
      - name: Checkout T3
        uses: actions/checkout@v7
        with:
          path: T3

      # 2. Checkout ARC (Dependency)
      - name: Checkout ARC
        uses: actions/checkout@v7
        with:
          repository: ReactionMechanismGenerator/ARC
          ref: main
          path: ARC

      # 5. Clean Disk (Important for heavy conda envs)
      - name: Clean Ubuntu Image
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 6. Setup T3 Environment
      - name: Set up micromamba (t3_env)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: t3_env
          environment-file: T3/environment.yml
          cache-environment: true
          generate-run-shell: true

      # 7. Setup RMG Environment (rmg_env), which T3 runs RMG and Arkane in as subprocesses. Built
      # from devtools/rmg_env.yml, the same file `make install` reads, in package mode: rmgpy,
      # arkane and the RMG database come from the pinned conda packages, so no RMG-Py or
      # RMG-database checkout is compiled or put on PYTHONPATH. Add no package here; change the
      # spec file instead.
      - name: Set up micromamba (rmg_env)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: rmg_env
          environment-file: T3/devtools/rmg_env.yml
          cache-environment: true
          generate-run-shell: false

      # 9. Install & Compile ARC (Dependency, into t3_env)
      - name: Install and Compile ARC
        shell: micromamba-shell {0}
        working-directory: ARC
        run: |
          echo "::group::Compile ARC extensions"
          make compile
          echo "::endgroup::"

          echo "::group::Install ARC in editable mode"
          pip install -e .
          echo "::endgroup::"

      # 9b. Install xTB into its own xtb_env (used by ARC for gfn2 jobs)
      - name: Install xTB
        shell: bash -el {0}
        working-directory: ARC
        run: bash devtools/install_xtb.sh

      # 10. Install T3 (Self)
      - name: Install T3
        shell: micromamba-shell {0}
        working-directory: T3
        run: |
          pip install -e .

      # 10b. Assert that rmg_env is the pin, reached the way T3 reaches it: through ARC's
      # rmg_env_command, with ARC's RMG_PATH unset and a decoy rmgpy on the parent's PYTHONPATH.
      # Fails unless Python, rmg, rmgdatabase and numdifftools match devtools/rmg_env.yml, rmgpy
      # and arkane load from rmg_env's site-packages, ARC and rmgpy read the same database, the
      # imports of T3's rmg_env scripts succeed, and `python -m arkane --help` exits 0.
      - name: Verify rmg_env matches devtools/rmg_env.yml
        shell: micromamba-shell {0}
        working-directory: T3
        run: python devtools/check_rmg_env.py

      # 11. Run T3 Tests
      - name: Run Tests
        shell: micromamba-shell {0}
        working-directory: T3
        run: |
          echo "Running T3 Tests..."
          export PYTHONPATH="$PYTHONPATH:$(pwd):${{ github.workspace }}/ARC"

          # Run pytest on the T3 tests directory
          pytest tests/ --cov=t3 --cov-report=xml -ra -vv

      # 9. Upload Coverage
      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: T3/coverage.xml
          flags: unittests
          name: codecov-t3
          fail_ci_if_error: false
